# SPDX-License-Identifier: AGPL-3.0-only
name: Windows TR quick compile
on:
  push:
    branches: ["feat/windows-*"]
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: WPF and core build (without native packaging)
        shell: pwsh
        run: dotnet build windows/CouchSubs.Windows.slnx -c Release
